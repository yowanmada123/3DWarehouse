<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MAGINTEK — 3D Warehouse Ops</title>
  <meta name="description" content="Dashboard operasional gudang 3D (dummy) dibuat dengan Three.js: truk, forklift, stok, dan pengiriman dalam satu tampilan live." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 29 9v14L16 30 3 23V9z' fill='%232f5bea'/%3E%3Cpath d='M16 2 29 9 16 16 3 9z' fill='%235b80f5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="scene" aria-label="Peta gudang 3D"></canvas>
    <div id="labels" aria-hidden="true"></div>

    <!-- Loading -->
    <div id="loader"><div class="cube-spin"></div><span>Memuat gudang 3D…</span></div>

    <!-- Top bar -->
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M16 2 29 9v14L16 30 3 23V9z" fill="#2f5bea"/><path d="M16 2 29 9 16 16 3 9z" fill="#6f8ff7"/><path d="M16 16v14L3 23V9z" fill="#2449c9"/></svg>
        <span id="brandName">WareFlow</span>
      </div>

      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="text" placeholder="Search sites, trucks, forklifts, shipments…" autocomplete="off" />
        <kbd>/</kbd>
        <div class="search-results" id="searchResults"></div>
      </div>

      <div class="grow"></div>

      <div class="site-switch">
        <button id="siteBtn" class="site-btn" aria-haspopup="listbox">
          <span class="site-code" id="siteCode">WH-01</span>
          <span class="site-meta"><b id="siteName">—</b><small id="siteSub">—</small></span>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="site-menu" id="siteMenu" role="listbox"></div>
      </div>

      <div class="live"><span class="dot"></span>Live <span id="clock">--:--</span></div>

      <button class="icon-btn bell" id="bellBtn" title="Notifikasi">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z M10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span class="badge" id="bellBadge">3</span>
      </button>
      <div class="notif" id="notifPanel"></div>

      <div class="user">
        <div class="avatar">RP</div>
        <div class="user-meta"><b>Rina Putri</b><small>Operations Manager</small></div>
      </div>
    </header>

    <!-- KPI cards -->
    <section class="kpis" id="kpis"></section>

    <!-- Map tools -->
    <div class="map-tools">
      <button data-tool="in" title="Zoom in">+</button>
      <button data-tool="out" title="Zoom out">−</button>
      <button data-tool="rotate" title="Auto rotate"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button data-tool="reset" title="Reset view"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button data-tool="home" title="Semua site"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    </div>

    <!-- Site panel -->
    <aside class="panel" id="sitePanel"></aside>
    <button class="panel-toggle" id="panelToggle">Detail site</button>

    <!-- Shipment tracking -->
    <section class="shipment" id="shipment"></section>

    <!-- Fleet list -->
    <section class="fleet">
      <div class="fleet-head">
        <span class="fleet-ico"><svg viewBox="0 0 24 24" width="14" height="14"><rect x="3" y="5" width="18" height="14" rx="3" fill="#fff" opacity=".9"/><path d="M3 9h18" stroke="#2f5bea" stroke-width="2"/></svg></span>
        <div class="tabs" id="fleetTabs">
          <button data-tab="docks" class="active">Docks <small></small></button>
          <button data-tab="forklifts">Forklifts <small></small></button>
          <button data-tab="trucks">Trucks <small></small></button>
        </div>
        <span class="fleet-site" id="fleetSite"></span>
      </div>
      <div class="fleet-list" id="fleetList"></div>
    </section>

    <div class="toast" id="toast"></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
